name: codex
version: "1.0.0"
description: "OpenAI Codex CLI coding agent runtime environment"
author: "Serverless-Sandbox"
tags:
  - ai-agent
  - coding
  - openai
  - codex

base: ubuntu:22.04

system_packages:
  - git
  - curl
  - wget
  - build-essential
  - ca-certificates
  - gnupg

node:
  version: "22"

node_packages:
  - "@openai/codex"

env:
  LANG: C.UTF-8
  DEBIAN_FRONTEND: noninteractive
  # Set your OpenAI API key
  # OPENAI_API_KEY: ""
