name: hermes-agent
version: "1.0.0"
description: "Nous Research Hermes Agent - self-improving AI agent runtime environment"
author: "Serverless-Sandbox"
tags:
  - ai-agent
  - nous-research
  - hermes
  - self-improving

base: ubuntu:22.04

system_packages:
  - git
  - curl
  - wget
  - build-essential
  - ca-certificates
  - gnupg
  - ripgrep
  - ffmpeg
  - python3
  - python3-pip
  - python3-venv

python:
  version: "3.11"

env:
  LANG: C.UTF-8
  DEBIAN_FRONTEND: noninteractive
  # Configure your model provider API key
  # OPENAI_API_KEY: ""
  # ANTHROPIC_API_KEY: ""
  # OPENROUTER_API_KEY: ""
