name: openclaw
version: "1.0.0"
description: "OpenClaw AI assistant runtime environment"
author: "Serverless-Sandbox"
tags:
  - ai-agent
  - assistant
  - openclaw
  - open-source

base: ubuntu:22.04

system_packages:
  - git
  - curl
  - wget
  - build-essential
  - ca-certificates
  - gnupg

node:
  version: "22"

node_packages:
  - "openclaw@latest"

env:
  LANG: C.UTF-8
  DEBIAN_FRONTEND: noninteractive
  # Configure your model provider API key
  # OPENAI_API_KEY: ""
  # ANTHROPIC_API_KEY: ""
